---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Upgrade installed packages
  apt:
    upgrade: dist

- name: Install common packages
  apt:
    name:
      - git
      - curl
      - wget
      - unzip
      - vim
      - net-tools
      - python3-pip
      - ca-certificates
      - software-properties-common
    state: present